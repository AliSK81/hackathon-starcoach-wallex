[project]
name = "wx"
version = "0.1.0"
description = "A bot that trades on Wallex by itself."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wx = "wx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
